name: Release PR

# A PR into release is a release (from main) or a hotfix (from hotfix/*); a PR into a support line
# (support/vX.Y) patches an older version, from hotfix/* only. A release PR's description is
# replaced with the version and changelog that merging it publishes, worked out on the PR's merge
# commit exactly as release.yml will after the merge, so reviewing the PR is reviewing the release
# notes. To fix a line, edit the original PR's title, then re-run this job. A support PR's
# description is the version and changelog line merging it publishes, and follows its title and labels.
on:
  pull_request:
    # labeled/unlabeled: the internal label decides whether a support PR publishes anything.
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
    branches: [release, "support/v*"]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Release preview
    runs-on: ubuntu-latest
    steps:
      - name: Only main or a hotfix branch may merge into release, only a hotfix into a support line
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$BASE_REF:$HEAD_REF" in
            release:main | release:hotfix/* | support/*:hotfix/*) ;;
            release:*) echo "::error::release only takes PRs from main or hotfix/*, not $HEAD_REF"; exit 1 ;;
            *) echo "::error::$BASE_REF only takes PRs from hotfix/*, not $HEAD_REF"; exit 1 ;;
          esac

      # The PR's merge commit with every tag: both previews count from the last tag it contains.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write the release into the PR description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The plan re-checks the titles it lists: one edited after merging never met the PR title check.
          CHANGELOG_DENYLIST: ${{ vars.CHANGELOG_DENYLIST }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" != release ]; then
            python3 tools/release/release.py support-preview --labels "$LABELS" -- "$BASE_REF" "$TITLE" "$PR" > "$RUNNER_TEMP/body.md"
          elif [ "$HEAD_REF" != main ]; then
            printf 'Hotfix: merging this publishes a patch release whose changelog is this PR'"'"'s title.\n' > "$RUNNER_TEMP/body.md"
          else
            version="$(python3 tools/release/release.py plan "$RUNNER_TEMP/notes.md")"
            if [ -z "$version" ]; then
              printf 'Nothing to release: no `feat:` or `fix:` PR since the last release. Merging this tags nothing.\n' > "$RUNNER_TEMP/body.md"
            else
              {
                printf '## Merging this publishes v%s\n\n' "$version"
                printf 'Changelog, exactly as it will be published:\n\n'
                cat "$RUNNER_TEMP/notes.md"
              } > "$RUNNER_TEMP/body.md"
            fi
          fi
          gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md"
