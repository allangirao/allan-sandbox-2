name: Release drafter

# Labels every PR from its title. The labels are for reading the PR list; the version and notes
# come from the titles themselves (tools/release/release.py plan), not from a release-drafter
# draft, whose date window drops a main PR merged before a hotfix release that did not ship it.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: [main, release]

permissions:
  contents: read

jobs:
  label:
    name: Label from title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
