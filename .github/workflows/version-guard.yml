name: Version guard

# Only a release writes the version: a PR may bring in a tagged release, never change it (release.py check-version).
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main, release, "support/v*"]

permissions:
  contents: read

jobs:
  version:
    name: Version unchanged
    runs-on: ubuntu-latest
    steps:
      # The PR's merge commit, its first parent (the tip of the branch it merges into) and every tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The PR leaves the version alone
        run: python3 tools/release/release.py check-version
